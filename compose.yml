services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: license-app
    restart: unless-stopped
    ports:
      - "8000:9000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/var/www/html
    networks:
      - license-network

  db:
    image: postgres:16
    container_name: license-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - license-network

  redis:
    image: redis:7
    container_name: license-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - license-network

networks:
  license-network:
    driver: bridge

volumes:
  db-data:
