services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: license-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - license-network

  nginx:
    image: nginx:latest
    container_name: license-nginx
    restart: unless-stopped
    ports:
      - "8000:80"   # <-- access app here
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - license-network

  db:
    image: postgres:16
    container_name: license-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - license-network

  redis:
    image: redis:7
    container_name: license-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - license-network

networks:
  license-network:
    driver: bridge

volumes:
  db-data:
